<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <form>
            <label for="name1">Name:</label><br>
            <input type="text" id="name1" required maxlength="50" minlength="2"><br>
            <label for="email1">Email:</label><br>
            <input type="email" id="email1" required><br>
            <label for="message1">Message:</label><br>
            <textarea id="message1" rows="5" required maxlength="500"></textarea><br>
            <button type="submit">Submit</button>
        </form>
        <div class="bg-light">
            <div class="container mt-5">
                <form novalidate>
                    <div class="form-group mb-3">
                        <label for="name2" class="form-label">Name:</label>
                        <input type="text" id="name2" class="form-control" placeholder="Enter name" required maxlength="50" minlength="2">
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Name is required (min 2 chars).</div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="email2" class="form-label">Email:</label>
                        <input type="email" id="email2" class="form-control" placeholder="Enter email" required>
                        <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Valid email is required.</div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="message2" class="form-label">Message:</label>
                        <textarea id="message2" rows="5" class="form-control" placeholder="Enter message" required maxlength="500"></textarea>
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Message is required.</div>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
        <div class="mt-5 bg-light">
            <div class="container mt-5">
                <h2 class="mb-4">Register</h2>
                <form novalidate>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" class="form-control" required>
                            <div class="invalid-feedback">Required.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" id="lastName" class="form-control" required>
                            <div class="invalid-feedback">Required.</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email3" class="form-label">Email</label>
                        <input type="email" id="email3" class="form-control" required>
                        <div class="invalid-feedback">Valid email required.</div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password1" class="form-label">Password</label>
                            <input type="password" id="password1" class="form-control" required minlength="8">
                            <div class="invalid-feedback">Min 8 characters.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="password2" class="form-label">Confirm password</label>
                            <input type="password" id="password2" class="form-control" required>
                            <div class="invalid-feedback">Password must match.</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" required>
                            <label class="form-check-label">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender">
                            <label class="form-check-label">Female</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Hobbies</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">Reading</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">Sports</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Country</label>
                        <select class="form-select" required>
                            <option value="">Choose...</option>
                            <option>Kazakhstan</option>
                            <option>Russia</option>
                            <option>USA</option>
                        </select>
                        <div class="invalid-feedback">Select a country.</div>
                    </div>
                    <button type="submit" class="btn btn-success">Register</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </form>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>document.querySelectorAll('form')[1].addEventListener('submit', function (e) {
            e.preventDefault();
            var inputs = this.querySelectorAll('.form-control');
            for (var i = 0; i < inputs.length; i++) {
                if (inputs[i].checkValidity()) {
                    inputs[i].classList.add('is-valid');
                    inputs[i].classList.remove('is-invalid');
                } else {
                    inputs[i].classList.add('is-invalid');
                    inputs[i].classList.remove('is-valid');
                }
            }
            if (this.checkValidity()) alert('Form submitted successfully!');
            this.classList.add('was-validated');
        });
        </script>
        <script>document.querySelectorAll('form')[2].addEventListener('submit', function (e) {
            e.preventDefault();
            var inputs = this.querySelectorAll('.form-control, .form-select');
            for (var i = 0; i < inputs.length; i++) {
                if (inputs[i].checkValidity()) {
                    inputs[i].classList.add('is-valid');
                    inputs[i].classList.remove('is-invalid');
                } else {
                    inputs[i].classList.add('is-invalid');
                    inputs[i].classList.remove('is-valid');
                }
            }
            if (this.checkValidity()) alert('Form submitted successfully!');
            this.classList.add('was-validated');
        });
        </script>
        <script>
            var password1 = document.getElementById("password1")
            var password2 = document.getElementById("password2")
            function confirmPassword() {
                if (password1.value !== password2.value) {
                    password2.setCustomValidity("Passwords don't match");
                } else {
                    password2.setCustomValidity("");
                }
            }
            password1.addEventListener('input', confirmPassword);
            password2.addEventListener('input', confirmPassword);
        </script>
    </body>
</html>
